pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // Capacitor Android currently declares its own Google/Maven repositories.
    // Prefer this centralized list while allowing compatible plugin build scripts.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MyChat"
include ":app"

// npx cap sync android generates this file from installed Capacitor plugins.
apply from: "capacitor.settings.gradle"
