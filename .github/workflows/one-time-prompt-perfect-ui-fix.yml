# trigger: run once now that this workflow exists on main
name: one-time-prompt-perfect-ui-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Prompt Perfect audit UI changes
        shell: python {0}
        run: |
          from pathlib import Path
          import subprocess

          root = Path(".")
          app = root / "src/App.tsx"
          types = root / "src/types/index.ts"
          chat = root / "src/components/ChatMessage.tsx"

          # Idempotency guard.
          if "promptPerfectOutput?: string;" in types.read_text(encoding="utf-8"):
              print("Patch already applied; nothing to do.")
              raise SystemExit(0)

          s = types.read_text(encoding="utf-8")
          old = "  modifiedFiles?: string[];\n}"
          new = "  modifiedFiles?: string[];\n  /** Exact prompt produced by Prompt Perfect and sent to the model. */\n  promptPerfectOutput?: string;\n}"
          assert old in s
          types.write_text(s.replace(old, new, 1), encoding="utf-8")

          s = app.read_text(encoding="utf-8")
          old = """      let adaptedContent = userMessage.content || '';

      if (isPromptPerfectEnabled) {
        adaptedContent = optimizePrompt(adaptedContent);
        currentThinkingSteps.push({
          id: `step_prompt_perfect_${Date.now()}`,
          icon: 'lightning',
          title: 'Prompt Perfect 已完成本轮提示词优化',
          status: 'completed',
        });
      }
"""
          new = """      let adaptedContent = userMessage.content || '';
      let promptPerfectOutput: string | undefined;

      if (isPromptPerfectEnabled) {
        promptPerfectOutput = optimizePrompt(adaptedContent);
        adaptedContent = promptPerfectOutput;
        currentThinkingSteps.push({
          id: `step_prompt_perfect_${Date.now()}`,
          icon: 'lightning',
          title: 'Prompt Perfect 已完成本轮提示词优化',
          status: 'completed',
        });
        setConversations(prev => prev.map(c => c.id !== updatedConv.id ? c : {
          ...c,
          messages: c.messages.map(m => m.id === assistantMsgId
            ? { ...m, promptPerfectOutput, thinkingSteps: [...currentThinkingSteps] }
            : m),
        }));
      }
"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """            steps={
              message.thinkingSteps && message.thinkingSteps.length > 0
                ? message.thinkingSteps
                : message.status === 'streaming' && !message.content
                ? [
                    {
                      id: 'default-step-1',
                      icon: 'github',
                      title: '分析输入内容与构建模型上下文',
                      status: 'running',
                    },
                  ]
                : undefined
            }
"""
          # The exact block is in ChatMessage.tsx, not App.tsx. Keep this assertion
          # only as a safety check against accidentally touching unrelated rendering.
          if old in s:
              raise AssertionError("Unexpected ThinkingSteps block found in App.tsx")

          app.write_text(s, encoding="utf-8")

          s = chat.read_text(encoding="utf-8")
          old = "  const [copied, setCopied] = useState(false);\n"
          new = """  const [copied, setCopied] = useState(false);
  const [promptPerfectCopied, setPromptPerfectCopied] = useState(false);
"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  const handleCopy = () => {
    navigator.clipboard.writeText(message.content);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
"""
          new = """  const handleCopy = () => {
    navigator.clipboard.writeText(message.content);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const handleCopyPromptPerfect = async () => {
    if (!message.promptPerfectOutput) return;
    try {
      await navigator.clipboard.writeText(message.promptPerfectOutput);
      setPromptPerfectCopied(true);
      setTimeout(() => setPromptPerfectCopied(false), 1800);
    } catch (error) {
      console.warn('Failed to copy Prompt Perfect output:', error);
    }
  };
"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """        {/* Thinking & Action Steps Stream (图片中展示的信息条样式) */}
        {!isUser && (
          <ThinkingSteps
            steps={
              message.thinkingSteps && message.thinkingSteps.length > 0
                ? message.thinkingSteps
                : message.status === 'streaming' && !message.content
                ? [
                    {
                      id: 'default-step-1',
                      icon: 'github',
                      title: '分析输入内容与构建模型上下文',
                      status: 'running',
                    },
                  ]
                : undefined
            }
            isStreaming={message.status === 'streaming'}
            hasContent={Boolean(message.content && message.content.trim().length > 0)}
          />
        )}

        {/* Web Search Sources — grouped summary + readable source cards */}
"""
          new = """        {/* Thinking & Action Steps Stream: only concrete runtime events are shown. */}
        {!isUser && (
          <ThinkingSteps
            steps={message.thinkingSteps && message.thinkingSteps.length > 0 ? message.thinkingSteps : undefined}
            isStreaming={message.status === 'streaming'}
            hasContent={Boolean(message.content && message.content.trim().length > 0)}
          />
        )}

        {/* Prompt Perfect: show the exact optimized prompt produced for this request. */}
        {!isUser && message.promptPerfectOutput && (
          <div className="rounded-xl border border-violet-500/20 bg-violet-500/[0.035] dark:bg-violet-950/15 overflow-hidden animate-in fade-in">
            <div className="px-3 py-2 border-b border-violet-500/10 flex items-center gap-2">
              <span className="text-xs font-semibold text-violet-700 dark:text-violet-300">Prompt Perfect 优化结果</span>
              <span className="text-[10px] text-neutral-400">实际发送给模型的提示词</span>
              <button
                type="button"
                onClick={handleCopyPromptPerfect}
                className="ml-auto inline-flex items-center gap-1.5 rounded-lg border border-violet-500/15 px-2 py-1 text-[10px] font-medium text-violet-700 dark:text-violet-300 hover:bg-violet-500/10 transition"
                title="复制 Prompt Perfect 实际生成的提示词"
              >
                {promptPerfectCopied ? <Check className="w-3 h-3 text-emerald-500" /> : <Copy className="w-3 h-3" />}
                <span>{promptPerfectCopied ? '已复制' : '一键复制'}</span>
              </button>
            </div>
            <pre className="px-3 py-2.5 max-h-72 overflow-auto whitespace-pre-wrap break-words text-[11px] leading-relaxed font-sans text-neutral-700 dark:text-neutral-300 select-text">
              {message.promptPerfectOutput}
            </pre>
          </div>
        )}

        {/* Web Search Sources — grouped summary + readable source cards */}
"""
          assert old in s
          s = s.replace(old, new, 1)
          chat.write_text(s, encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "src/App.tsx", "src/types/index.ts", "src/components/ChatMessage.tsx"], check=True)
          subprocess.run(["git", "commit", "-m", "feat: expose Prompt Perfect output"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

          # Remove this one-shot workflow after the real source commit has been pushed.
          workflow = root / ".github/workflows/one-time-prompt-perfect-ui-fix.yml"
          if workflow.exists():
              workflow.unlink()
              subprocess.run(["git", "add", str(workflow)], check=True)
              subprocess.run(["git", "commit", "-m", "chore: remove one-time patch workflow"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
