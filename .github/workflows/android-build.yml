name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/android-build.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          for abi in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libnode.so"
            unzip -l "$APK" | grep -q "lib/$abi/libpython3.13.so"
          done
          unzip -l "$APK" | grep -q "assets/www/index.html"
          unzip -l "$APK" | grep -q "assets/smoke-test.html"
          unzip -l "$APK" | grep -q "assets/node-runtime/manifest.json"
          unzip -l "$APK" | grep -q "assets/node-runtime/node_modules/npm/bin/npm-cli.js"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mychat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: debug-apk
    runs-on: ubuntu-latest

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: mychat-debug-apk
          path: artifacts

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            APK="artifacts/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.yuivo9999.mychat
            adb logcat -c
            adb shell am start -n com.yuivo9999.mychat/.MainActivity --ez mychat_smoke_test true
            sleep 15
            adb shell dumpsys activity activities | grep -q "com.yuivo9999.mychat/.MainActivity"
            if adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Process: com.yuivo9999.mychat" | grep -q "FATAL EXCEPTION"; then
              adb logcat -d -v brief
              exit 1
            fi
            adb shell dumpsys package com.yuivo9999.mychat | grep -q "versionName=0.1.4"
            adb logcat -d -v brief | grep -q "MYCHAT_SMOKE_TEST_PASS"
