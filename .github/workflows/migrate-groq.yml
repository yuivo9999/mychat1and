name: Validate and Deploy Groq catalog

on:
  push:
    paths:
      - '.github/workflows/migrate-groq.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Groq catalog
        run: |
          grep -q "id: 'groq'" src/services/db.ts
          grep -q "name: 'groq.com'" src/services/db.ts
          ! grep -q "id: 'cerebras'" src/services/db.ts
          ! grep -q "id: 'ollama'" src/services/db.ts
          grep -q "id: 'openai/gpt-oss-120b'" src/services/db.ts
          grep -q "id: 'openai/gpt-oss-20b'" src/services/db.ts
          grep -q "id: 'openai/gpt-oss-safeguard-20b'" src/services/db.ts
          grep -q "id: 'qwen/qwen3.8-27b'" src/services/db.ts
          echo "Groq catalog validation passed"

      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
